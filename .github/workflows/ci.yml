name: CI

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check premium boundary
        run: npm run check:premium-boundary

      - name: Run linter
        run: npm run lint

      - name: Run formatter check
        run: npx biome check . --linter-enabled=false --assist-enabled=false

      - name: Typecheck
        run: npm run typecheck

      - name: Run unit tests
        run: npm run test:run

      - name: Build project
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: dist/
          retention-days: 7

  # Runs the WHOLE e2e suite, not just the smoke spec. The job keeps the name
  # `e2e-smoke` because branch protection on main requires that exact context;
  # renaming the job without updating the protection rule would leave the
  # required check permanently pending and block every merge. Rename both
  # together when convenient.
  #
  # Until 2026-08-21 this ran only smoke.spec.ts + paid-lifecycle, and the other
  # ~150 specs were written, maintained, and executed by nothing. They had been
  # failing on main since May, one of them since the day it was written, and
  # they were hiding a real under-reporting bug the whole time (ADA-984). A
  # suite that never runs is worse than no suite: it reads as coverage on the
  # PR checklist and provides none.
  e2e-smoke:
    runs-on: ubuntu-latest
    # Without a ceiling a stalled step runs until GitHub's 6h default, burning
    # the runner budget and leaving the PR "pending" rather than failing. The
    # full suite runs in about a minute locally.
    timeout-minutes: 20
    needs: quality

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The browser download is ~90MB from Playwright's CDN and was the single
      # least reliable step in this workflow (it hung or failed on roughly one
      # run in three, 2026-08-18/20). Caching it removes the fetch from the
      # common path; the timeout below still bounds the miss.
      - name: Resolve Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          # Keyed on the exact version, with no restore-keys on purpose: a
          # browser build from another Playwright version is not a usable
          # partial hit, it is a mismatch that fails at run time.
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        # Observed hanging indefinitely on the browser download (2026-08-18/19),
        # which is a CDN fetch, not a test. Fail fast so a rerun can recover.
        timeout-minutes: 8
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system dependencies
        # The cache holds the browser binaries, not the apt packages they link
        # against — those live in the runner's filesystem and are discarded.
        # Skipping this on a cache hit gets a Chromium that will not launch.
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        timeout-minutes: 8
        run: npx playwright install-deps chromium

      - name: Start offline server
        run: npm run dev:offline > /tmp/hoursmith-offline.log 2>&1 &

      - name: Wait for offline server
        run: |
          for attempt in {1..60}; do
            if curl -sI --max-time 5 http://127.0.0.1:5174/ >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/hoursmith-offline.log
          exit 1

      - name: Run E2E suite
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      - name: Upload offline server log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: offline-server-log
          path: /tmp/hoursmith-offline.log
          retention-days: 7

  # Premium /account subscription lifecycle (active → canceled → revoked,
  # ADA-274). Runs against a PREMIUM offline build with the billing backend
  # mocked at the network layer — no secrets required (the dev script inlines a
  # mock Supabase env). Complements the deployed-staging `e2e-sandbox` workflow.
  e2e-premium-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: quality

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The browser download is ~90MB from Playwright's CDN and was the single
      # least reliable step in this workflow (it hung or failed on roughly one
      # run in three, 2026-08-18/20). Caching it removes the fetch from the
      # common path; the timeout below still bounds the miss.
      - name: Resolve Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          # Keyed on the exact version, with no restore-keys on purpose: a
          # browser build from another Playwright version is not a usable
          # partial hit, it is a mismatch that fails at run time.
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        # Observed hanging indefinitely on the browser download (2026-08-18/19),
        # which is a CDN fetch, not a test. Fail fast so a rerun can recover.
        timeout-minutes: 8
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system dependencies
        # The cache holds the browser binaries, not the apt packages they link
        # against — those live in the runner's filesystem and are discarded.
        # Skipping this on a cache hit gets a Chromium that will not launch.
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        timeout-minutes: 8
        run: npx playwright install-deps chromium

      - name: Start premium offline server
        run: npm run dev:premium:offline:e2e > /tmp/hoursmith-premium.log 2>&1 &

      - name: Wait for premium server
        run: |
          for attempt in {1..60}; do
            if curl -sI --max-time 5 http://127.0.0.1:5174/ >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/hoursmith-premium.log
          exit 1

      - name: Run premium lifecycle e2e
        run: npm run test:e2e:lifecycle

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-premium
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      - name: Upload premium server log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: premium-server-log
          path: /tmp/hoursmith-premium.log
          retention-days: 7
