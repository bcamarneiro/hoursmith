name: CLA Assistant

# Gates pull requests behind a signed Contributor License Agreement (see CLA.md).
# First-time contributors are asked to comment the sign-off line below on their PR;
# their signature is recorded in the `cla-signatures` branch so they only sign once.
#
# ── One-time setup required by the maintainer ────────────────────────────────
# Create a repo secret `CLA_SIGNATURES_TOKEN` = a Personal Access Token with
# write access to this repository's contents (classic: `repo` scope, or a
# fine-grained token scoped to hoursmith with Contents: read/write). The action
# uses it to commit signatures to the `cla-signatures` branch. Until that secret
# exists the workflow runs but cannot store signatures.
# ─────────────────────────────────────────────────────────────────────────────

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla-assistant:
    runs-on: ubuntu-latest
    steps:
      - name: CLA Assistant
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        # Third-party action pinned to a full commit SHA (not a mutable tag) for
        # supply-chain safety — this job runs on pull_request_target with a write
        # token. Review + bump the SHA via Dependabot when upgrading.
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PERSONAL_ACCESS_TOKEN: ${{ secrets.CLA_SIGNATURES_TOKEN }}
        with:
          path-to-signatures: 'signatures/version1/cla.json'
          path-to-document: 'https://github.com/bcamarneiro/hoursmith/blob/main/CLA.md'
          branch: 'cla-signatures'
          custom-notsigned-prcomment: 'Thanks for your contribution! Before we can merge it, please sign the [Contributor License Agreement](https://github.com/bcamarneiro/hoursmith/blob/main/CLA.md) by posting the exact comment below on this PR:'
          custom-pr-sign-comment: 'I have read the CLA Document and I hereby sign the CLA'
          custom-allsigned-prcomment: 'All contributors have signed the CLA. ✅'
          # People/bots exempt from signing (maintainer + automation).
          allowlist: bcamarneiro,dependabot[bot],renovate[bot],github-actions[bot]
